name: Deploy viz to GitHub Pages

# Publishes the static demo in viz/ to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main, antigravity]
    paths:
      - "viz/**"
      - "section2-reformulation/**"
      - "advisor-update-2026-07-22/**"
      - "poster-demo/**"
      - "results/figures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow only one concurrent deployment, don't cancel in-progress production deploys
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        # One-time manual setup required first (the Actions token cannot create the
        # Pages site itself — "Resource not accessible by integration"):
        #   repo Settings -> Pages -> Build and deployment -> Source = GitHub Actions
        # After that this step just reads the existing site config and deploy works.
        uses: actions/configure-pages@v5
      - name: Build combined site
        run: |
          mkdir -p _site
          cp -r viz/. _site/
          cp -r section2-reformulation _site/section2-reformulation
          cp -r advisor-update-2026-07-22 _site/advisor-update-2026-07-22
          cp -r poster-demo _site/poster-demo
          mkdir -p _site/results/figures
          cp -r results/figures/. _site/results/figures/
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
