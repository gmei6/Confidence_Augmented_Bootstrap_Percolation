[pytest]
pythonpath = src
# overnight-runs/<date>/workspace is a git worktree holding a full second copy of
# tests/, so collecting it makes every test module collide on basename with its
# twin ("import file mismatch", 13 errors). Excluded rather than gitignore-only:
# pytest walks the tree itself and does not consult .gitignore.
norecursedirs = overnight-runs .git build
markers =
    slow: mark test as slow to run.
